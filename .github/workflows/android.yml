name: Build Mesut IPTV

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      -       - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android config (Android 10+, TV, cleartext)
        run: python3 scripts/patch_android.py

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK (installable) and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Mesut-IPTV.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Mesut-IPTV.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Mesut-IPTV
          path: dist/*
